<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The five stages of the pipeline, with human judgment above and external checks below</title>
  <desc id="d">Five boxes in a row are joined by solid arrows from left to right: Stage 1 Knowledge acquisition, Stage 2 Content development, Stage 3 Review and verification, Stage 4 AI-tutor coaching and Stage 5 Assessment development. A band above them, Human judgment as specified in the framework, lists blueprints, expert review, misconceptions and item ratings, with dashed arrows down to Stages 1, 3, 4 and 5 and none to Stage 2. A band below them lists kinds of external check, with dotted arrows arriving from Stages 1, 3 and 5. Two boxes at the bottom, Certification alignment and Delivery, sit outside the five stages.</desc>
  <defs>
    <marker id="head-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#184f95"/>
    </marker>
    <marker id="head-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#7a4b00"/>
    </marker>
    <marker id="head-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0b5d2a"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>

  <!-- Top band: human judgment -->
  <rect x="30" y="12" width="900" height="84" rx="10" fill="#fdf3e1" stroke="#7a4b00" stroke-width="2"/>
  <g fill="#0b0b0b" text-anchor="middle">
    <text x="480" y="45" font-size="20" font-weight="700">Human judgment (as specified in the framework)</text>
    <text x="480" y="73" font-size="18">blueprints · expert review · misconceptions · item ratings</text>
  </g>

  <!-- Stage boxes -->
  <g fill="#e8f0fb" stroke="#184f95" stroke-width="2">
    <rect x="30" y="140" width="156" height="110" rx="10"/>
    <rect x="216" y="140" width="156" height="110" rx="10"/>
    <rect x="402" y="140" width="156" height="110" rx="10"/>
    <rect x="588" y="140" width="156" height="110" rx="10"/>
    <rect x="774" y="140" width="156" height="110" rx="10"/>
  </g>
  <g fill="#0b0b0b" text-anchor="middle">
    <text x="108" y="173" font-size="17">Stage 1</text>
    <text x="108" y="199" font-size="19">Knowledge</text>
    <text x="108" y="225" font-size="19">acquisition</text>
    <text x="294" y="173" font-size="17">Stage 2</text>
    <text x="294" y="199" font-size="19">Content</text>
    <text x="294" y="225" font-size="19">development</text>
    <text x="480" y="173" font-size="17">Stage 3</text>
    <text x="480" y="199" font-size="19">Review and</text>
    <text x="480" y="225" font-size="19">verification</text>
    <text x="666" y="173" font-size="17">Stage 4</text>
    <text x="666" y="199" font-size="19">AI-tutor</text>
    <text x="666" y="225" font-size="19">coaching</text>
    <text x="852" y="173" font-size="17">Stage 5</text>
    <text x="852" y="199" font-size="19">Assessment</text>
    <text x="852" y="225" font-size="19">development</text>
  </g>

  <!-- Solid arrows between stages -->
  <g stroke="#184f95" stroke-width="2" fill="none">
    <line x1="188" y1="195" x2="214" y2="195" marker-end="url(#head-blue)"/>
    <line x1="374" y1="195" x2="400" y2="195" marker-end="url(#head-blue)"/>
    <line x1="560" y1="195" x2="586" y2="195" marker-end="url(#head-blue)"/>
    <line x1="746" y1="195" x2="772" y2="195" marker-end="url(#head-blue)"/>
  </g>

  <!-- Dashed amber arrows: people's judgment to Stages 1, 3, 4 and 5 -->
  <g stroke="#7a4b00" stroke-width="2" fill="none" stroke-dasharray="8 4">
    <line x1="108" y1="96" x2="108" y2="138" marker-end="url(#head-amber)"/>
    <line x1="480" y1="96" x2="480" y2="138" marker-end="url(#head-amber)"/>
    <line x1="666" y1="96" x2="666" y2="138" marker-end="url(#head-amber)"/>
    <line x1="852" y1="96" x2="852" y2="138" marker-end="url(#head-amber)"/>
  </g>

  <!-- Dotted green arrows: Stages 1, 3 and 5 to the outside checks -->
  <g stroke="#0b5d2a" stroke-width="2" fill="none" stroke-dasharray="2 5" stroke-linecap="round">
    <line x1="108" y1="252" x2="108" y2="298" marker-end="url(#head-green)"/>
    <line x1="480" y1="252" x2="480" y2="298" marker-end="url(#head-green)"/>
    <line x1="852" y1="252" x2="852" y2="298" marker-end="url(#head-green)"/>
  </g>

  <!-- Bottom band: kinds of external check -->
  <rect x="30" y="300" width="900" height="100" rx="10" fill="#e9f5ee" stroke="#0b5d2a" stroke-width="2"/>
  <g fill="#0b0b0b" text-anchor="middle">
    <text x="480" y="329" font-size="20" font-weight="700">Kinds of external check (no results reported here)</text>
    <text x="480" y="355" font-size="18">vendor-scored certification exam · analysis built on the knowledge base</text>
    <text x="480" y="381" font-size="18">review by an adopting institution's experts · standards-body review</text>
  </g>

  <!-- Side row: not stages -->
  <g fill="#f4f4f2" stroke="#52514e" stroke-width="2">
    <rect x="30" y="430" width="440" height="80" rx="10"/>
    <rect x="490" y="430" width="440" height="80" rx="10"/>
  </g>
  <g fill="#0b0b0b" text-anchor="middle">
    <text x="250" y="462" font-size="19" font-weight="700">Certification alignment</text>
    <text x="250" y="488" font-size="17">a parallel workstream, not a stage</text>
    <text x="710" y="462" font-size="19" font-weight="700">Delivery</text>
    <text x="710" y="488" font-size="17">optional, outside the framework</text>
  </g>

  <!-- Legend -->
  <line x1="30" y1="535" x2="74" y2="535" stroke="#7a4b00" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#head-amber)"/>
  <line x1="290" y1="535" x2="334" y2="535" stroke="#0b5d2a" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#head-green)"/>
  <g fill="#0b0b0b" font-size="17">
    <text x="88" y="541">people's judgment</text>
    <text x="348" y="541">outside check</text>
  </g>
</svg>
